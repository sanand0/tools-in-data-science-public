<!-- Apply persisted user theme before paint to avoid theme flash. -->
<script>
  (function () {
    var t = localStorage.getItem("tds-theme");
    if (t === "light" || t === "dark") {
      document.documentElement.setAttribute("data-user-theme", t);
    }
  })();
</script>

<!-- KaTeX math rendering -->
<link rel="stylesheet" href="{{ "katex/katex.min.css" | relURL }}" />
<script defer src="{{ "katex/katex.min.js" | relURL }}"></script>
<script defer src="{{ "katex/auto-render.min.js" | relURL }}"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var renderMath = function () {
      if (typeof renderMathInElement === "function") {
        renderMathInElement(document.body, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "\\[", right: "\\]", display: true },
            { left: "\\(", right: "\\)", display: false }
          ],
          throwOnError: false
        });
      } else {
        setTimeout(renderMath, 50);
      }
    };
    renderMath();
  });
</script>
